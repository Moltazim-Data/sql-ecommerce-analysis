name: duckdb-analysis-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas pytest
      - run: python sql_analysis.py
      - run: python -m pytest -q
